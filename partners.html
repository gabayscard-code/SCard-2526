<script>

/* Previous partners (archived for reference):

  { name:"Kindred", tier:"Platinum", discount: ["40% discount on medical consultations to new customers","30% discount to medical consultations to old customers"], filters:["Services","Other Locations"] },
  { name:"Homeboy Hainanese Hawker", tier:"Platinum", discount:"20% discount", filters:["Other Locations","Food"] },
  { name:"Funki Izakaya", tier:"Bronze", discount:["10% discount every Monday to Thursday","5% discount every Friday and Saturday","Free Hot or Iced Americano for every ₱300 purchase"], filters:["Along Katipunan","Food"] },
  { name:"Funki Pizzikaya", tier:"Bronze", discount:["10% discount every Monday to Thursday","5% discount every Friday and Saturday","Free Hot or Iced Americano for every ₱300 purchase"], filters:["Along Katipunan","Food"] },
  { name:"Charlie’s", tier:"Bronze", discount:["10% discount every Monday to Thursday","5% discount every Friday and Saturday","Free Hot or Iced Americano for every ₱300 purchase"], filters:["Along Katipunan","Food"] },
  { name:"Funki Izakaya - Masinag", tier:"Bronze", discount:["10% discount every Monday to Thursday","5% discount every Friday and Saturday","Free Hot or Iced Americano for every ₱300 purchase"], filters:["Other Locations","Food"] },
  { name:"Anytime Fitness", tier:"Platinum", discount:["38% discount on the Regular Enrollment Package","Tiered discounts on Personal Training Packages"], filters:["Along Katipunan","Services"] },
  { name:"Allo Coffee Roasters", tier:"Bronze", discount:"10% discount on drinks", filters:["Food","Along Katipunan"] },
  { name:"SweetBread Cafe", tier:"Bronze", discount: ["10% discount on one food order per member per day", "10% discount on one drink order per member per day"] , filters:["Food","Others"] },
  { name:"Potico.ph", tier:"Platinum", discount:"30% discount with free shipping (ADMUGABAY30), valid for multiple uses with a maximum discount of Php 250.00", filters:["Accessories","Other Locations", "Online"] },
  { name:"FlowerStore", tier:"Platinum", discount:"20% discount with free shipping (ADMUGABAY20), valid for multiple uses with a maximum discount of Php 200.00", filters:["Accessories","Other Locations", "Online"] },
  { name:"Hikori", tier:"Bronze", discount:"10% discount on menu items", filters:["Food","JSEC"] },

  { name:"PC Formula", tier:"Gold", discount:"15% discount on services", filters:["Services","Other Locations"] },
  { name:"Mason's Cafe", tier:"Bronze", discount:"10% discount on all products", filters:["Food","Along Katipunan"] },

  { name:"Yummy Tokyo", tier:"Gold", discount:"15% discount on all regular priced items", filters:["Food","Regis"] },
  { name:"Namit Gid Ya", tier:"Gold", discount:"15% discount on all menu items", filters:["Food","JSEC"] },
  { name:"LA Sauce Sneaker laundry Katiipunan", tier:"Bronze", discount:"10% discount on services", filters:["Service","Along Katipunan"] },

  { name:"Cozi Studios", tier:"Platinum", discount:"20% discount", filters:["Accessories","Other Location", "Online"] },
  { name:"Brucal Dental Studios", tier:"Platinum", discount:"20% discount on services", filters:["Services","Along Katipunan"] },

const cardContainer = document.getElementById("cardContainer");
const pagination = document.getElementById("pagination");

let currentPage = 1;
const cardsPerPage = 9;
let filteredPartners = [...partners];

function renderCards(list, page=1) {
  if (list.length === 0) {
    cardContainer.innerHTML = `
      <div style="grid-column: 1 / -1; text-align: center; padding: 60px 20px; color: #0e8a56; font-family: 'Karla', sans-serif;">
        <p style="font-size: 1.3rem; font-weight: 700; margin: 0 0 8px 0; color: #119462;">No partners available yet.</p>
        <p style="font-size: 1rem; color: #555; margin: 0;">Stay tuned for new partner announcements this school year!</p>
      </div>
    `;
    updatePagination(list);
    return;
  }

  const start = (page - 1) * cardsPerPage;
  const end = start + cardsPerPage;
  const paginated = list.slice(start, end);

  cardContainer.innerHTML = paginated.map(p => `
    <div style="
      background:white; 
      border-radius:18px; 
      padding:18px 20px; 
      box-shadow:0 4px 14px rgba(0,0,0,0.06);
      border-top:5px solid ${getTierColor(p.tier)};
      transition:transform 0.25s ease, box-shadow 0.25s ease;
    ">
      <h3 style="margin:0; font-family:'Inter', sans-serif; font-weight:800; font-size:1.35rem; color:#0b965e;">${p.name}</h3>
      <p style="margin:6px 0; font-family:'Inter', sans-serif; font-size:0.95rem; color:#4a5568;"><strong style="color:#1a202c;">${p.tier}</strong> Partner</p>
      <div style="margin:6px 0; font-family:'Karla', sans-serif; font-size:0.95rem; color:#2d3748; line-height:1.45;">
        ${
          Array.isArray(p.discount)
            ? `<ul style="margin:4px 0 6px 0; padding-left:18px; list-style-type:disc;">${p.discount.map(d => `<li style="margin-bottom:3px;">${d}</li>`).join('')}</ul>`
            : `<div>${p.discount}</div>`
        }
      </div>
      <div style="display:flex; flex-wrap:wrap; gap:6px; margin-top:10px;">
        ${p.filters.map(f => `<span style="
          background-color:${getFilterColor(f)}; 
          color:#0e8a56;
          font-family:'Inter', sans-serif;
          font-weight:700;
          padding:4px 10px;
          border-radius:20px;
          font-size:12px;
        ">${f}</span>`).join('')}
      </div>
    </div>
  `).join('');

  updatePagination(list);
}

function getTierColor(tier) {
  switch(tier) {
    case "Platinum": return "#119462";
    case "Gold": return "#e5a919";
    case "Bronze": return "#7ebd6c";
    default: return "#cfe1b0";
  }
}

function getFilterColor(filter) {
  const colors = ["#cfe1b0", "#f1d2c2", "#e0ee9d", "#fdd6e5"];
  return colors[filter.length % colors.length];
}

function filterCards() {
  const search = document.getElementById("searchInput").value.toLowerCase().trim();
  const activeFilter = document.querySelector(".filter-btn.active").dataset.filter;

  filteredPartners = partners.filter(p => {
    const discountText = Array.isArray(p.discount) ? p.discount.join(' ') : (p.discount || '');
    const matchesSearch = !search || p.name.toLowerCase().includes(search) || discountText.toLowerCase().includes(search);
    const matchesFilter = activeFilter === "all" || p.filters.includes(activeFilter);
    return matchesSearch && matchesFilter;
  });

  currentPage = 1;
  renderCards(filteredPartners, currentPage);
}

function updatePagination(list) {
  const totalPages = Math.ceil(list.length / cardsPerPage);
  pagination.innerHTML = "";

  if (totalPages <= 1) return;

  for (let i = 1; i <= totalPages; i++) {
    const btn = document.createElement("button");
    btn.textContent = i;
    btn.className = "page-number";
    if (i === currentPage) btn.classList.add("active-page");
    btn.addEventListener("click", () => {
      currentPage = i;
      renderCards(filteredPartners, currentPage);
    });
    pagination.appendChild(btn);
  }
}

document.getElementById("searchInput").addEventListener("input", filterCards);

document.querySelectorAll(".filter-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    // Remove 'active' from all
    document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
    
    // Add 'active' to clicked button
    btn.classList.add("active");
    
    // Apply filter
    filterCards();
  });
});

// Initial render
renderCards(partners);
</script>
